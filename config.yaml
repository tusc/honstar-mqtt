name: HOnStar MQTT
version: "2.4.0"
slug: honstar-mqtt
description: >-
  MQTT Bridge for Honda/Acura EVs based on the GM BEV3 platform.
  Polls vehicle status (battery, range, tires, charging, odometer)
  and publishes to MQTT topics.
url: https://github.com/tusc/honstar-mqtt
image: ghcr.io/tusc/honstar-mqtt-{arch}
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
startup: application
boot: auto
services:
  - mqtt:need
options:
  hws_email: ""
  hws_password: ""
  hws_pin: ""
  vin: ""
  mqtt_url: "mqtt://auto_username:auto_password@auto_hostname"
  poll_interval: 900
  units: imperial
  debug: false
schema:
  hws_email: email
  hws_password: password
  hws_pin: str?
  vin: str?
  mqtt_url: str?
  poll_interval: int?
  units: list(imperial|metric)?
  debug: bool?
init: false
